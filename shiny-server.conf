# Shiny Server configuration for PhenoWatch
# Configures multiple worker processes for concurrent request handling

# Run server as shiny user
run_as shiny;

# Define the server
server {
  listen 3838;
  
  # Serve the phenowatch application at the root path
  # This works for all three deployments: Shinyapps.io, App Runner, and HF Spaces
  location / {
    app_dir /srv/shiny-server/phenowatch;
    
    # Configure multiple worker processes for concurrent users
    # Each worker can handle requests in parallel independently
    # With 16GB RAM available, 4 workers is safe (each uses ~1GB per request)
    workers 4;
    
    # Worker settings notes:
    # - Allows up to 4 concurrent user requests to run in parallel
    # - Reduces queuing time dramatically (from 25s × N to ~25s for concurrent N users)
    # - If CPU reaches 100%, reduce to 3 workers
    # - Each worker process is independent R instance
  }
}
