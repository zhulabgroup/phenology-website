# Shiny Server configuration for PhenoWatch

# Run server as shiny user
run_as shiny;

# Required by Shiny Server; logs will be written here
log_dir /var/log/shiny-server;

# Define the server
server {
  listen 3838;
  
  # Serve the phenowatch application at the root path
  location / {
    app_dir /srv/shiny-server/phenowatch;
  }
}
